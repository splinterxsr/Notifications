name: CI/CD Pipeline - Notifications Function

on:
  push:
    branches:
      - cloud
  pull_request:
    branches:
      - cloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Notifications.sln

      - name: Build Solution
        run: dotnet build Notifications.sln --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test Notifications.sln --no-build --configuration Release --verbosity normal

      # Publica especificamente o projeto da Function gerando os arquivos de saída
      - name: Publish Function
        run: dotnet publish Notifications.Function/Notifications.Function.csproj --configuration Release --output ./publish

      # Salva os arquivos compilados como artefato para o deploy
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ./publish

  deploy:
    name: Deploy to Azure Function App
    needs: build-and-test
    if: github.ref == 'refs/heads/cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: ./publish

      # 1. Autenticação na Azure
      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Deploy no Azure Function App
      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: sendemail-notifications
          package: ./publish
