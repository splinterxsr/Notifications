name: CI/CD Pipeline - Notifications Function

on:
  push:
    branches:
      - cloud
  pull_request:
    branches:
      - cloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Notifications.slnx

      - name: Build Solution
        run: dotnet build Notifications.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test Notifications.slnx --no-build --configuration Release --verbosity normal

      # Publica especificamente o projeto da Function
      - name: Publish Function
        run: dotnet publish Notifications.Function/Notifications.Function.csproj --configuration Release --output ./publish

      # Cria o arquivo ZIP incluindo explicitamente arquivos ocultos (.azurefunctions)
      - name: Package Function App
        run: |
          cd ./publish
          zip -r ../function-app.zip . .azurefunctions*
          cd ..

      # Salva o arquivo ZIP gerado como artefato
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app-package
          path: function-app.zip

  deploy:
    name: Deploy to Azure Function App
    needs: build-and-test
    if: github.ref == 'refs/heads/cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app-package
          path: .

      # 1. Autenticação na Azure
      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Deploy no Azure Function App apontando para o ZIP correto
      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        with:
          app-name: sendemail-notifications
          package: function-app.zip
